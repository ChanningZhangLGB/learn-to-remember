# Backbone block merged over `llm:` in configs/lere.yaml. Prices: USD per 1M tokens,
# the provider's list prices (Table 3); used only for the cost ledger in report.json.
llm:
  provider: gemini          # Gemini API, OpenAI-compatible endpoint; key: GEMINI_API_KEY
  model: gemini-3.1-flash-lite
  price_per_mtok:
    input: 0.25
    cached_input: 0.025
    output: 1.50
